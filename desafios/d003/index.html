<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antes e Depois</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #333;
        }

        main {
            background-color: #FFF;
            margin: 10px auto;
            max-width: 400px;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 2px 2px 5px rgba(51, 51, 51, 0.336);
            text-align: center;
        }

        h1 {
            color: #333;
            padding: 5px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px;
            border-radius: 20px;
            font-weight: 600;
            color: #FFF;
            background-color: rgb(45, 45, 226);
            outline: none;
            border: none;
            box-shadow: 2px 2px 5px rgba(51, 51, 51, 0.3);
        }

        button:hover {
            background-color: rgb(45, 108, 226);

        }
        
    </style>
</head>
<body>
    <main>
        <h1>Antes e Depois</h1>
        <button onclick="antesDepois()">Antecessor e Sucessor</button>
    </main>
    
    <!-- JAvaScriprt-->
    <script>
        function antesDepois() {
            var valor = parseInt(prompt(`Digite um número inteiro qualquer`))
            alert(`Antes de ${valor}, temos o número ${valor - 1}
Depois de ${valor}, temos o número ${valor + 1}`)
        }
    </script>
</body>
</html>
