<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: lightgray;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 10px;
        }

        main {
            background-color: gray;
            width: 80%;
            max-width: 500px;
            margin: auto;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 2px 2px 3px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        main h1 {
            color: #fff;
            font-variant: small-caps;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
        }

        main section.botoes {
            padding: 5px;
            width: 50%;
            margin: 30px auto 0px;

            display: flex;
            align-items: center;
            justify-content: space-evenly;
            flex-flow: row wrap;
            gap: 10px;
        }

        main section.botoes button {
            padding: 10px;
            border-radius: 8px;
            outline: none;
            border: none;
            background-color: #fff;
            color: #494949;
            font-weight: 600;

            flex-grow: 1;
            flex-shrink: 1;
        }

        #botao1:hover {
            background-color: seagreen;
            color: #fff;
            transition: all .5s ease-in-out;
        }

        #botao2:hover {
            background-color: salmon;
            color: #fff;
            transition: all .5s ease-in-out;
        }

        #botao3:hover {
            background-color: slateblue;
            color: #fff;
            transition: all .5s ease-in-out;
        }
    </style>
</head>
<body>
    <main>
        <h1>Desafio das Mensagens</h1>
        <section class="botoes">
            <button id="botao1" onclick="clicouBotao1()">Botão 1</button>
            <button id="botao2" onclick="clicouBotao2()">Botão 2</button>
            <button id="botao3" onclick="clicouBotao3()">Botão 3</button>
        </section>
    </main>

    <!-- JavaScript -->
    <script>
        function clicouBotao1() {
            alert(`Você clicou no 1º botão!`)
        }

        function clicouBotao2() {
            alert(`Você clicou no 2º botão!`)
        }

        function clicouBotao3() {
            alert(`Você clicou no 3º botão!`)
        }
    </script>
</body>
</html>
