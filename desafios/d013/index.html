<!DOCTYPE html>
<html lang="pt-mz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Situacao do aluno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Situacao do Aluno</h1>
    </header>
    <main>
        <button id="btn">Entrar com as notas</button>
        <p class="msg-clique">Clique no botão acima para informar as notas do aluno.</p>

        <section class="resultado">
            <table class="tabela">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Nota 1</th>
                        <th>Nota 2</th>
                        <th>Nota 3</th>
                        <th>Media</th>
                        <th>Situacao</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="td"></td>
                        <td class="td"></td>
                        <td class="td"></td>
                        <td class="td"></td>
                        <td class="td"></td>
                        <td><span class="situacao"></span></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>


    <!-- JS -->
    <script src="js.js"></script>
</body>
</html>
