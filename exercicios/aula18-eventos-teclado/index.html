<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keydown e Keyup - eventos de teclado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 1em;
            background-color: dimgray;
            color: white;
        }

        main {
            text-align: center;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <main>
        <h1>Ola mundo</h1>
        <h2>Keydown e Keyup - eventos de teclado</h2>
    </main>


    <!-- JS -->
    <script>
        // keydown - Quando clicamos uma tecla
        document.addEventListener('keydown', function(e) {
            if (e.key === "Enter") {
                console.log(`Parabens! Apertou a tecla ENTER`);
            } else {
                console.log(`VC Apertou a tecla ${e.key.toUpperCase()}, por favor aperte a tecla ENTER`);
            }
        });

        // keyup - Quando soltamos a tecla
        document.addEventListener('keyup', function(e) {
            console.log(`VC soltou a tecla ${e.key.toUpperCase()}`);
        });
    </script>
</body>
</html>
