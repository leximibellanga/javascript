<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soma de dois valores</title>
    <style>
        body {
            background-color: rgb(105, 105, 173);
            color: #fff;
            font: normal 1.5em Arial;
        }

        h1 {
            color: gold;
        }
    </style>
</head>
<body>
    <h1>Ola, meu nome é <strong>Leximibel.</strong></h1>
    <!-- Parte do javaScript -->
    <script>
        var n1 = Number(window.prompt("Digite um valor"))
        var n2 = Number(window.prompt("Digite outro valor"))
        var soma = n1 + n2
        window.alert(`A soma entre ${n1} e ${n2} é ${soma}`)
    </script>
</body>
</html>
