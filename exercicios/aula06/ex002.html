<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tratando variaveis</title>
    <style>
        body {
            background-color: rgb(105, 105, 173);
            color: #fff;
            font: normal 1.5em Arial;
        }

        h1 {
            color: gold;
        }
    </style>
</head>
<body>
    <h1>Ola, meu nome é <strong>Leximibel.</strong></h1>
    <!-- Parte do javaScript -->
    <script>
        var nome = window.prompt("Informe o seu nome: ")
        window.alert("Ola " + nome + ", é um grande prazer te conhecer!")
    </script>
</body>
</html>
