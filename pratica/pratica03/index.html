<!DOCTYPE html>
<html lang="pt-mz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Contador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Vamos contar</h1>
    </header>

    <section>
        <div>
            <p class="campo">
                <label for="iinicio">Inicio: </label>
                <input type="number" name="inicio" id="iinicio"> <!--0-->
            </p>
            <p class="campo">
                <label for="ifim">Fim: </label>
                <input type="number" name="fim" id="ifim"> <!--1-->
            </p>
            <p class="campo">
                <label for="ipasso">Passo: </label>
                <input type="number" name="passo" id="ipasso"> <!--2-->
            </p>
            <p class="campo" id="botao">
                <input type="button" value="Contar"> <!--3-->
            </p>
        </div>

        <div id="res">
            <p>preparando contagem...</p>
        </div>
    </section>
    
    <footer>
        <a href="http://github.com/leximibellanga/" target="_blank">&copy;Leximibel Langa</a>
    </footer>
    <!-- JS -->
    <script src="script.js"></script>
</body>
</html>
